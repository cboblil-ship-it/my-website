<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="יומן בריאות">
<meta name="theme-color" content="#2C3E6B">
<title>יומן בריאות</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'%3E%3Crect width='192' height='192' rx='40' fill='%232C3E6B'/%3E%3Cpath d='M96 145 C96 145 48 108 48 74 C48 56 62 44 78 44 C88 44 95 50 96 54 C97 50 104 44 114 44 C130 44 144 56 144 74 C144 108 96 145 96 145Z' fill='white'/%3E%3Crect x='87' y='62' width='18' height='44' rx='5' fill='%232C3E6B'/%3E%3Crect x='74' y='75' width='44' height='18' rx='5' fill='%232C3E6B'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --navy:    #2C3E6B;
  --navy-d:  #1a2745;
  --navy-l:  #E8ECF5;
  --teal:    #1A6B7C;
  --teal-l:  #E0F2F5;
  --gold:    #B8860B;
  --gold-l:  #FFF8E1;
  --red:     #B01020;
  --red-l:   #FDECEA;
  --bg:      #F4F2EF;
  --card:    #FFFFFF;
  --border:  #C8C4BC;
  --text:    #1A1714;
  --muted:   #5A5550;
}
body { font-family: "Heebo", -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 17px; -webkit-text-size-adjust: 100%; }
.app { max-width: 500px; margin: 0 auto; min-height: 100vh; }

/* HEADER */
.hdr { background: linear-gradient(135deg, var(--navy-d) 0%, var(--navy) 100%); padding: 16px 18px 12px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 20; box-shadow: 0 2px 12px rgba(44,62,107,.3); }
.title { font-size: 21px; font-weight: 800; color: #fff; letter-spacing: .02em; }
.title span { opacity: .8; font-weight: 400; font-size: 14px; display: block; margin-top: 1px; }
.doc-btn { background: rgba(255,255,255,.15); color: #fff; border: 1.5px solid rgba(255,255,255,.4); border-radius: 22px; padding: 7px 15px; font-size: 13px; font-family: inherit; font-weight: 700; cursor: pointer; backdrop-filter: blur(4px); }

/* TABS */
.tabs { display: flex; background: var(--card); border-bottom: 2px solid var(--navy-l); position: sticky; top: 62px; z-index: 10; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.tb { flex: 1; padding: 10px 2px 8px; border: none; background: none; font-family: inherit; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tb-ico { font-size: 18px; }
.tb.on { color: var(--navy); border-bottom-color: var(--navy); }

/* CONTENT */
.content { padding: 14px 13px 40px; }
.sec { display: none; }
.sec.on { display: block; }

/* CARD */
.card { background: var(--card); border-radius: 16px; border: 1.5px solid var(--border); padding: 17px; margin-bottom: 13px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.ct { font-size: 11px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 13px; display: flex; align-items: center; gap: 6px; }

/* FIELDS */
.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 11px; }
.fg { display: flex; flex-direction: column; gap: 5px; }
.fl { font-size: 15px; font-weight: 700; color: var(--text); }
.fi { border: 2px solid var(--border); border-radius: 12px; padding: 11px 12px; font-size: 17px; font-family: inherit; background: var(--bg); color: var(--text); width: 100%; -webkit-appearance: none; transition: border-color .15s; }
.fi:focus { outline: none; border-color: var(--navy); background: #fff; }

/* CHIPS */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
.chip { border: 2px solid var(--border); border-radius: 24px; padding: 9px 15px; font-size: 15px; font-family: inherit; font-weight: 600; background: var(--bg); color: var(--muted); cursor: pointer; -webkit-appearance: none; transition: all .15s; }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }

/* BIG INPUTS */
.bw { position: relative; text-align: center; }
.bi { border: 2px solid var(--border); border-radius: 14px; padding: 14px 8px 24px; font-size: 36px; font-weight: 700; font-family: inherit; background: var(--bg); color: var(--text); width: 100%; text-align: center; -webkit-appearance: none; transition: border-color .15s; }
.bi:focus { outline: none; border-color: var(--navy); background: #fff; }
.bi::placeholder { color: #ccc; }
.iu { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); pointer-events: none; }

/* STATUS BADGES */
.badge { margin-top: 10px; padding: 10px 14px; border-radius: 11px; font-size: 15px; font-weight: 700; display: none; }
.badge.ok     { display: block; background: #E8F5E9; color: #1B5E20; border: 1.5px solid #A5D6A7; }
.badge.warn   { display: block; background: var(--gold-l); color: var(--gold); border: 1.5px solid #FFD54F; }
.badge.danger { display: block; background: var(--red-l); color: var(--red); border: 1.5px solid #FFCDD2; }

/* TEXTAREA */
.ta { border: 2px solid var(--border); border-radius: 12px; padding: 11px; font-size: 16px; font-family: inherit; background: var(--bg); color: var(--text); width: 100%; resize: none; min-height: 74px; -webkit-appearance: none; }
.ta:focus { outline: none; border-color: var(--navy); background: #fff; }

/* BUTTONS */
.btn-p { width: 100%; padding: 16px; background: var(--navy); color: #fff; border: none; border-radius: 14px; font-size: 18px; font-family: inherit; font-weight: 800; cursor: pointer; margin-bottom: 8px; -webkit-appearance: none; box-shadow: 0 3px 10px rgba(44,62,107,.3); }
.btn-p:active { opacity: .88; }
.btn-o { width: 100%; padding: 13px; background: var(--card); color: var(--navy); border: 2px solid var(--navy); border-radius: 14px; font-size: 16px; font-family: inherit; font-weight: 700; cursor: pointer; margin-bottom: 8px; -webkit-appearance: none; }

/* EXPORT ROW */
.export-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 13px; }
.exp-btn { padding: 12px 8px; background: var(--card); border: 2px solid var(--navy); border-radius: 13px; font-size: 14px; font-family: inherit; font-weight: 700; color: var(--navy); cursor: pointer; text-align: center; -webkit-appearance: none; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.exp-btn .eico { font-size: 22px; }

/* TOAST */
.toast { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--navy-d); color: #fff; padding: 11px 24px; border-radius: 28px; font-size: 15px; font-weight: 600; z-index: 999; transition: transform .3s; white-space: nowrap; pointer-events: none; }
.toast.show { transform: translateX(-50%) translateY(0); }

/* HISTORY */
.hi { background: var(--card); border: 1.5px solid var(--border); border-radius: 14px; padding: 13px 15px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.05); }
.hd { font-size: 13px; color: var(--muted); margin-bottom: 7px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.delbtn { background: none; border: none; color: var(--red); cursor: pointer; font-size: 18px; padding: 0; }
.hvs { display: flex; gap: 13px; flex-wrap: wrap; }
.hv { font-size: 16px; font-weight: 700; }
.hv small { font-size: 12px; color: var(--muted); font-weight: 500; }
.hn { font-size: 13px; color: var(--muted); margin-top: 7px; border-top: 1px solid #eee; padding-top: 7px; }
.empty { text-align: center; padding: 38px 20px; color: var(--muted); font-size: 16px; }

/* FILTER BUTTONS */
.fr { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
.fb { border: 2px solid var(--border); border-radius: 22px; padding: 7px 14px; font-size: 14px; font-family: inherit; font-weight: 600; background: var(--card); color: var(--muted); cursor: pointer; -webkit-appearance: none; }
.fb.on { background: var(--navy); border-color: var(--navy); color: #fff; }

/* CHARTS */
.cw { position: relative; width: 100%; height: 180px; margin-top: 7px; }
.ag { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.ab { background: var(--navy-l); border-radius: 13px; padding: 13px; border: 1.5px solid var(--navy); }
.al { font-size: 12px; font-weight: 700; color: var(--navy-d); margin-bottom: 3px; }
.av { font-size: 23px; font-weight: 800; color: var(--navy-d); }
.au { font-size: 11px; color: var(--navy-d); font-weight: 600; }

/* REMINDERS */
.rem-item { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 13px 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
.rem-item.urgent { border-color: var(--red); background: var(--red-l); }
.rem-item.soon   { border-color: var(--gold); background: var(--gold-l); }
.rem-item.ok2    { border-color: var(--navy); background: var(--navy-l); }
.rem-ico { font-size: 26px; flex-shrink: 0; }
.rem-body { flex: 1; }
.rem-ttl { font-size: 16px; font-weight: 700; }
.rem-dt { font-size: 13px; color: var(--muted); margin-top: 2px; font-weight: 600; }
.rem-del { background: none; border: none; color: var(--red); font-size: 20px; cursor: pointer; padding: 0; flex-shrink: 0; }
.add-card { background: var(--navy-l); border: 2px solid var(--navy); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.add-ttl { font-size: 14px; font-weight: 800; color: var(--navy); margin-bottom: 12px; }

/* OVERLAY / MODAL */
.ov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: flex-end; justify-content: center; }
.ov.show { display: flex; }
.modal { background: var(--card); border-radius: 22px 22px 0 0; padding: 18px; width: 100%; max-width: 500px; max-height: 84vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.mh { width: 38px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 14px; }
.mt { font-size: 19px; font-weight: 800; margin-bottom: 2px; color: var(--navy); }
.ms { font-size: 13px; color: var(--muted); margin-bottom: 13px; }
.cbtn { width: 100%; padding: 13px; background: var(--bg); border: 2px solid var(--border); border-radius: 12px; font-size: 16px; font-family: inherit; font-weight: 700; margin-top: 10px; cursor: pointer; color: var(--text); -webkit-appearance: none; }
.sg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.sb2 { background: var(--navy-l); border-radius: 11px; padding: 12px; border: 1.5px solid var(--navy); }

@media print {
  .hdr,.tabs,.fr,.btn-p,.btn-o,.export-row,.delbtn,.doc-btn,.toast,.ov,.add-card,.rem-del,#sec-entry,#sec-charts,#sec-reminders { display: none !important; }
  .sec { display: none !important; }
  #sec-history { display: block !important; }
  body { background: #fff; }
  .app { max-width: 100%; }
  .content { padding: 0; }
}
</style>
</head>
<body>
<div class="app">

<div class="hdr">
  <div>
    <div class="title">&#128138; יומן בריאות</div>
  </div>
  <button class="doc-btn" onclick="openDoc()">&#129338; צפיית רופא</button>
</div>

<div class="tabs">
  <button class="tb on" id="tb-entry" onclick="sw('entry')"><span class="tb-ico">&#9999;&#65039;</span>רישום</button>
  <button class="tb" id="tb-history" onclick="sw('history')"><span class="tb-ico">&#128203;</span>היסטוריה</button>
  <button class="tb" id="tb-charts" onclick="sw('charts')"><span class="tb-ico">&#128202;</span>גרפים</button>
  <button class="tb" id="tb-reminders" onclick="sw('reminders')"><span class="tb-ico">&#9201;&#65039;</span>תזכורות</button>
</div>

<div class="content">

  <!-- ENTRY -->
  <div class="sec on" id="sec-entry">
    <div class="card">
      <div class="ct">&#128197; תאריך ושעה</div>
      <div class="r2">
        <div class="fg"><div class="fl">תאריך</div><input type="date" class="fi" id="e-date"></div>
        <div class="fg"><div class="fl">שעה</div><input type="time" class="fi" id="e-time"></div>
      </div>
      <div class="fg">
        <div class="fl">מדידה</div>
        <div class="chips">
          <button type="button" class="chip on" id="chip-0" onclick="setM('לפני אוכל',0)">לפני אוכל</button>
          <button type="button" class="chip" id="chip-1" onclick="setM('אחרי אוכל',1)">אחרי אוכל</button>
          <button type="button" class="chip" id="chip-2" onclick="setM('בוקר',2)">בוקר</button>
          <button type="button" class="chip" id="chip-3" onclick="setM('לילה',3)">לילה</button>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="ct">&#129400; סוכר בדם</div>
      <div class="bw" style="max-width:155px;margin:0 auto;">
        <input type="number" class="bi" id="e-glucose" placeholder="---" min="30" max="600" inputmode="decimal" oninput="updG()">
        <div class="iu">mg/dL</div>
      </div>
      <div class="badge" id="g-badge"></div>
    </div>
    <div class="card">
      <div class="ct">&#10084;&#65039; לחץ דם ודופק</div>
      <div class="fl" style="text-align:center;margin-bottom:9px;">לחץ דם (mmHg)</div>
      <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:11px;">
        <div class="bw" style="width:110px;">
          <input type="number" class="bi" id="e-sys" placeholder="120" min="60" max="250" inputmode="decimal" oninput="updBP()">
          <div class="iu">עליון</div>
        </div>
        <div style="font-size:36px;color:#ccc;font-weight:300;">/</div>
        <div class="bw" style="width:110px;">
          <input type="number" class="bi" id="e-dia" placeholder="80" min="40" max="150" inputmode="decimal" oninput="updBP()">
          <div class="iu">תחתון</div>
        </div>
      </div>
      <div class="badge" id="bp-badge"></div>
      <div class="fg" style="max-width:165px;margin-top:11px;">
        <div class="fl">דופק (פעימות/דקה)</div>
        <input type="number" class="fi" id="e-pulse" placeholder="72" min="30" max="220" inputmode="decimal">
      </div>
    </div>
    <div class="card">
      <div class="ct">&#128221; הערות</div>
      <textarea class="ta" id="e-notes" placeholder="תרופות, תסמינים, פעילות גופנית..."></textarea>
    </div>
    <button type="button" class="btn-p" onclick="saveE()">&#10003; שמור רשומה</button>
  </div>

  <!-- HISTORY -->
  <div class="sec" id="sec-history">
    <div class="export-row">
      <button type="button" class="exp-btn" onclick="doPrint()">
        <span class="eico">&#128438;</span>הדפס / PDF
      </button>
      <button type="button" class="exp-btn" onclick="doEmail()">
        <span class="eico">&#128231;</span>שלח במייל
      </button>
    </div>
    <div class="fr">
      <button type="button" class="fb on" onclick="setHF(7,this)">7 ימים</button>
      <button type="button" class="fb" onclick="setHF(14,this)">14 ימים</button>
      <button type="button" class="fb" onclick="setHF(30,this)">30 ימים</button>
      <button type="button" class="fb" onclick="setHF(9999,this)">הכל</button>
    </div>
    <div id="hist-list"></div>
  </div>

  <!-- CHARTS -->
  <div class="sec" id="sec-charts">
    <div class="fr">
      <button type="button" class="fb on" onclick="setCF(7,this)">7 ימים</button>
      <button type="button" class="fb" onclick="setCF(14,this)">14 ימים</button>
      <button type="button" class="fb" onclick="setCF(30,this)">30 ימים</button>
    </div>
    <div class="ag" id="avg-grid"></div>
    <div class="card">
      <div class="ct">&#129400; סוכר בדם</div>
      <div class="cw"><canvas id="gChart"></canvas></div>
    </div>
    <div class="card">
      <div class="ct">&#10084;&#65039; לחץ דם</div>
      <div class="cw"><canvas id="bpChart"></canvas></div>
    </div>
  </div>

  <!-- REMINDERS -->
  <div class="sec" id="sec-reminders">
    <div class="add-card">
      <div class="add-ttl">+ הוסף תזכורת לבדיקה</div>
      <div class="r2">
        <div class="fg"><div class="fl">תאריך</div><input type="date" class="fi" id="rem-date"></div>
        <div class="fg"><div class="fl">שעה</div><input type="time" class="fi" id="rem-time"></div>
      </div>
      <div class="fg" style="margin-bottom:10px;"><div class="fl">סוג הבדיקה</div><input type="text" class="fi" id="rem-title" placeholder="בדיקת דם כללית"></div>
      <div class="fg" style="margin-bottom:11px;"><div class="fl">מיקום / רופא</div><input type="text" class="fi" id="rem-loc" placeholder="קופת חולים מאי"></div>
      <button type="button" class="btn-p" onclick="addRem()">+ הוסף תזכורת</button>
    </div>
    <div id="rem-list"></div>
  </div>

</div>
</div>

<div class="toast" id="toast"></div>

<div class="ov" id="ov">
  <div class="modal">
    <div class="mh"></div>
    <div class="mt">&#129338; צפיית רופא</div>
    <div class="ms">סיכום נתוני המטופל — 7 הימים האחרונים</div>
    <div id="doc-cnt"></div>
    <button type="button" class="cbtn" onclick="closeDoc()">סגור</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
var K = "hd_v10";
var KR = "hd_rem_v3";
var entries = [];
var reminders = [];
var meal = "לפני אוכל";
var hDays = 7;
var cDays = 7;
var gC = null;
var bC = null;

function pad(n) { return String(n).padStart(2, "0"); }
function today() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function nowT() { var d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function fd(s) { var p = s.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; }
function sGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function sSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

// Load entries - try current key first, then all old keys
try {
  var _s = sGet(K);
  if (_s) { entries = JSON.parse(_s); }
  else {
    // migrate from older versions
    var oldKeys = ["hd_v9","hd_v8","hd_v7","hd_v6","hd_v5","hd_v4","hd_v3","hd_v2","healthDiary_v2","healthDiary"];
    for (var _i = 0; _i < oldKeys.length; _i++) {
      var _old = sGet(oldKeys[_i]);
      if (_old) { try { entries = JSON.parse(_old); sSet(K, _old); break; } catch(e2) {} }
    }
  }
} catch(e) { entries = []; }
// Load reminders - try current key first, then old keys
try {
  var _r = sGet(KR);
  if (_r) { reminders = JSON.parse(_r); }
  else {
    var oldRKeys = ["hd_rem_v2","hd_rem_v1"];
    for (var _j = 0; _j < oldRKeys.length; _j++) {
      var _oldr = sGet(oldRKeys[_j]);
      if (_oldr) { try { reminders = JSON.parse(_oldr); sSet(KR, _oldr); break; } catch(e3) {} }
    }
  }
} catch(e) { reminders = []; }

window.addEventListener("load", function() {
  document.getElementById("e-date").value   = today();
  document.getElementById("e-time").value   = nowT();
  document.getElementById("rem-date").value = today();
  document.getElementById("rem-time").value = "09:00";
  checkRem();
});

function saveEntries() { sSet(K,  JSON.stringify(entries));   }
function saveRems()    { sSet(KR, JSON.stringify(reminders)); }

function setM(lbl, idx) {
  meal = lbl;
  for (var i = 0; i < 4; i++) {
    var el = document.getElementById("chip-" + i);
    if (el) el.className = (i === idx) ? "chip on" : "chip";
  }
}

function gStatus(v) {
  if (v < 70)   return { c: "danger", t: "⚠ נמוך מדי — היפוגליקמיה" };
  if (v <= 100) return { c: "ok",     t: "✓ תקין" };
  if (v <= 125) return { c: "warn",   t: "⚡ גבולי" };
  if (v <= 180) return { c: "warn",   t: "⚡ גבוה מעט" };
  return               { c: "danger", t: "⚠ גבוה מאוד" };
}
function bpStatus(s, d) {
  // לפי הנחיות ACC/AHA 2017
  if (s < 90  || d < 60)  return { c: "danger", t: "⚠ נמוך מאוד" };
  if (s <= 120 && d <= 80) return { c: "ok",    t: "✓ תקין" };
  if (s <= 129 && d <= 80) return { c: "warn",  t: "⚡ גבוה-תקין" };
  if (s <= 139 || d <= 89) return { c: "warn",  t: "⚡ יתר לחץ דם שלב 1" };
  return                   { c: "danger",        t: "⚠ יתר לחץ דם שלב 2" };
}

function updG() {
  var v = parseFloat(document.getElementById("e-glucose").value);
  var el = document.getElementById("g-badge");
  if (!v || isNaN(v)) { el.className = "badge"; el.textContent = ""; return; }
  var s = gStatus(v); el.className = "badge " + s.c; el.textContent = s.t;
}
function updBP() {
  var s = parseFloat(document.getElementById("e-sys").value);
  var d = parseFloat(document.getElementById("e-dia").value);
  var el = document.getElementById("bp-badge");
  if (!s || !d || isNaN(s) || isNaN(d)) { el.className = "badge"; el.textContent = ""; return; }
  var st = bpStatus(s, d); el.className = "badge " + st.c; el.textContent = st.t;
}

function saveE() {
  var g = document.getElementById("e-glucose").value;
  var s = document.getElementById("e-sys").value;
  var d = document.getElementById("e-dia").value;
  if (!g && !s && !d) { alert("הזן לפחות מדד אחד"); return; }
  entries.unshift({
    id: Date.now(),
    date: document.getElementById("e-date").value,
    time: document.getElementById("e-time").value,
    meal: meal,
    glucose: g ? parseFloat(g) : null,
    bpSys:   s ? parseFloat(s) : null,
    bpDia:   d ? parseFloat(d) : null,
    pulse:   document.getElementById("e-pulse").value ? parseFloat(document.getElementById("e-pulse").value) : null,
    notes:   document.getElementById("e-notes").value
  });
  saveEntries();
  ["e-glucose","e-sys","e-dia","e-pulse","e-notes"].forEach(function(id) { document.getElementById(id).value = ""; });
  document.getElementById("g-badge").className  = "badge";
  document.getElementById("bp-badge").className = "badge";
  document.getElementById("e-time").value = nowT();
  toast("✓ הרשומה נשמרה");
}

function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(function() { t.classList.remove("show"); }, 2400);
}

function sw(name) {
  var tabs = ["entry","history","charts","reminders"];
  for (var i = 0; i < tabs.length; i++) {
    document.getElementById("sec-" + tabs[i]).className = "sec" + (tabs[i] === name ? " on" : "");
    document.getElementById("tb-"  + tabs[i]).className = "tb"  + (tabs[i] === name ? " on" : "");
  }
  if (name === "history")   renderH();
  if (name === "charts")    renderC();
  if (name === "reminders") renderRem();
}

function setHF(days, btn) {
  hDays = days;
  document.querySelectorAll("#sec-history .fb").forEach(function(b) { b.className = "fb"; });
  btn.className = "fb on"; renderH();
}
function getFiltered() {
  var co = new Date(); co.setDate(co.getDate() - hDays);
  return entries.filter(function(e) { return hDays >= 9999 || new Date(e.date) >= co; });
}
function renderH() {
  var el = document.getElementById("hist-list");
  var f = getFiltered();
  if (!f.length) { el.innerHTML = "<div class='empty'>אין רשומות לתקופה זו</div>"; return; }
  var h = "";
  for (var i = 0; i < f.length; i++) {
    var e = f[i];
    h += "<div class='hi'><div class='hd'><span>" + fd(e.date) + " &middot; " + e.time + " &middot; " + e.meal + "</span>";
    h += "<button type='button' class='delbtn' onclick='delE(" + e.id + ")'>&#128465;</button></div>";
    h += "<div class='hvs'>";
    if (e.glucose)           h += "<div class='hv'>&#129400; " + e.glucose + " <small>mg/dL</small></div>";
    if (e.bpSys && e.bpDia) h += "<div class='hv'>&#10084; " + e.bpSys + "/" + e.bpDia + " <small>mmHg</small></div>";
    if (e.pulse)             h += "<div class='hv'>&#128147; " + e.pulse + " <small>bpm</small></div>";
    h += "</div>" + (e.notes ? "<div class='hn'>" + e.notes + "</div>" : "") + "</div>";
  }
  el.innerHTML = h;
}
function delE(id) {
  if (!confirm("למחוק רשומה זו?")) return;
  entries = entries.filter(function(e) { return e.id !== id; });
  saveEntries(); renderH();
}

function setCF(days, btn) {
  cDays = days;
  document.querySelectorAll("#sec-charts .fb").forEach(function(b) { b.className = "fb"; });
  btn.className = "fb on"; renderC();
}
function avgArr(arr) {
  if (!arr.length) return null;
  return Math.round(arr.reduce(function(a,b) { return a+b; }, 0) / arr.length);
}
function renderC() {
  var co = new Date(); co.setDate(co.getDate() - cDays);
  var f = entries.filter(function(e) { return new Date(e.date) >= co; }).slice().reverse();
  var gV=[],sV=[],dV=[],gL=[],bL=[];
  f.forEach(function(e) {
    if (e.glucose)           { gV.push(e.glucose); gL.push(e.date.slice(5).replace("-","/")); }
    if (e.bpSys && e.bpDia) { sV.push(e.bpSys); dV.push(e.bpDia); bL.push(e.date.slice(5).replace("-","/")); }
  });
  var ag = avgArr(gV), as = avgArr(sV), ad = avgArr(dV);
  document.getElementById("avg-grid").innerHTML =
    "<div class='ab'><div class='al'>ממוצע סוכר</div><div class='av'>" + (ag||"—") + " <span class='au'>mg/dL</span></div>" +
    (ag ? "<div style='font-size:12px;font-weight:700;margin-top:2px;color:#1a2745'>" + gStatus(ag).t + "</div>" : "") + "</div>" +
    "<div class='ab'><div class='al'>ממוצע ל\"ד</div><div class='av'>" + (as&&ad ? as+"/"+ad : "—") + " <span class='au'>mmHg</span></div>" +
    (as&&ad ? "<div style='font-size:12px;font-weight:700;margin-top:2px;color:#1a2745'>" + bpStatus(as,ad).t + "</div>" : "") + "</div>";
  if (gC) { gC.destroy(); gC = null; }
  if (bC) { bC.destroy(); bC = null; }
  var xt = { font:{size:9}, maxRotation:40, autoSkip:true, maxTicksLimit:5 };
  if (gV.length) gC = new Chart(document.getElementById("gChart"), { type:"line", data:{ labels:gL, datasets:[{ data:gV, borderColor:"#2C3E6B", backgroundColor:"rgba(44,62,107,.1)", tension:.3, fill:true, pointRadius:3, borderWidth:2 }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ x:{ticks:xt}, y:{ticks:{font:{size:10}},suggestedMin:60,suggestedMax:200} }}});
  if (sV.length) bC = new Chart(document.getElementById("bpChart"), { type:"line", data:{ labels:bL, datasets:[{ label:"עליון", data:sV, borderColor:"#B01020", tension:.3, pointRadius:3, borderWidth:2 },{ label:"תחתון", data:dV, borderColor:"#2C3E6B", tension:.3, pointRadius:3, borderWidth:2, borderDash:[5,3] }]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:true,position:"top",labels:{font:{size:10},boxWidth:10,usePointStyle:true}}}, scales:{ x:{ticks:xt}, y:{ticks:{font:{size:10}},suggestedMin:50,suggestedMax:180} }}});
}

function addRem() {
  var d = document.getElementById("rem-date").value;
  var t = document.getElementById("rem-time").value;
  var title = document.getElementById("rem-title").value.trim();
  var loc   = document.getElementById("rem-loc").value.trim();
  if (!d || !title) { alert("אנא מלא תאריך וסוג הבדיקה"); return; }
  reminders.push({ id:Date.now(), date:d, time:t, title:title, loc:loc });
  reminders.sort(function(a,b) { return a.date.localeCompare(b.date); });
  saveRems();
  document.getElementById("rem-title").value = "";
  document.getElementById("rem-loc").value   = "";
  toast("✓ תזכורת נוספה"); renderRem();
}
function delRem(id) {
  if (!confirm("למחוק תזכורת זו?")) return;
  reminders = reminders.filter(function(r) { return r.id !== id; });
  saveRems(); renderRem();
}
function remCls(ds) {
  var t=new Date(); t.setHours(0,0,0,0);
  var d=new Date(ds); d.setHours(0,0,0,0);
  var diff=Math.round((d-t)/86400000);
  return (diff<0||diff<=3)?"urgent":diff<=7?"soon":"ok2";
}
function remDays(ds) {
  var t=new Date(); t.setHours(0,0,0,0);
  var d=new Date(ds); d.setHours(0,0,0,0);
  var diff=Math.round((d-t)/86400000);
  if(diff<0)  return "עבר לפני "+Math.abs(diff)+" ימים";
  if(diff===0) return "היום!";
  if(diff===1) return "מחר";
  return "בעוד "+diff+" ימים";
}
function renderRem() {
  var el = document.getElementById("rem-list");
  if (!reminders.length) { el.innerHTML="<div class='empty'>אין תזכורות קבועות</div>"; return; }
  var h = "";
  reminders.forEach(function(r) {
    var cls = remCls(r.date);
    var ico = cls==="urgent"?"&#128680;":cls==="soon"?"&#9888;&#65039;":"&#128197;";
    h += "<div class='rem-item "+cls+"'><div class='rem-ico'>"+ico+"</div><div class='rem-body'>";
    h += "<div class='rem-ttl'>"+r.title+"</div>";
    h += "<div class='rem-dt'>"+fd(r.date)+(r.time?" · "+r.time:"")+(r.loc?" · "+r.loc:"")+"</div>";
    h += "<div style='font-size:13px;font-weight:700;margin-top:3px;'>"+remDays(r.date)+"</div></div>";
    h += "<button type='button' class='rem-del' onclick='delRem("+r.id+")'>&#128465;</button></div>";
  });
  el.innerHTML = h;
}
function checkRem() {
  var urgent = reminders.filter(function(r) { return remCls(r.date)==="urgent"; }).length;
  var tb = document.getElementById("tb-reminders");
  if (tb && urgent > 0) {
    tb.innerHTML = "<span class='tb-ico'>&#9201;&#65039;</span>תזכורות<span style='background:#B01020;color:#fff;border-radius:9px;padding:1px 6px;font-size:11px;margin-right:3px;'>"+urgent+"</span>";
  }
}

function buildReportHTML(f, range) {
  var gv=[],sv=[],dv=[];
  f.forEach(function(e) {
    if(e.glucose) gv.push(e.glucose);
    if(e.bpSys)   sv.push(e.bpSys);
    if(e.bpDia)   dv.push(e.bpDia);
  });
  var ag=avgArr(gv), as=avgArr(sv), ad=avgArr(dv);
  var H = "<!DOCTYPE html><html lang='he' dir='rtl'><head><meta charset='UTF-8'>";
  H += "<link href='https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&display=swap' rel='stylesheet'>";
  H += "<style>*{box-sizing:border-box;margin:0;padding:0;}body{font-family:Heebo,Arial,sans-serif;background:#fff;color:#111;padding:20px;direction:rtl;}";
  H += ".top{text-align:center;border-bottom:3px solid #2C3E6B;padding-bottom:12px;margin-bottom:16px;}";
  H += "h1{font-size:22px;font-weight:800;color:#2C3E6B;margin-bottom:4px;}";
  H += ".sub{font-size:12px;color:#555;}";
  H += ".avgs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}";
  H += ".ab{background:#E8ECF5;border:2px solid #2C3E6B;border-radius:11px;padding:12px;}";
  H += ".al{font-size:10px;font-weight:700;color:#1a2745;margin-bottom:2px;}";
  H += ".av{font-size:20px;font-weight:800;color:#1a2745;}";
  H += ".row{border:1.5px solid #ccc;border-radius:9px;padding:10px 13px;margin-bottom:8px;page-break-inside:avoid;}";
  H += ".dt{font-size:11px;color:#555;font-weight:600;margin-bottom:4px;}";
  H += ".vals{display:flex;gap:14px;flex-wrap:wrap;}.v{font-size:14px;font-weight:700;}";
  H += ".v small{font-size:10px;font-weight:500;color:#666;}";
  H += ".note{font-size:11px;color:#666;margin-top:5px;border-top:1px solid #eee;padding-top:5px;}";
  H += "@media print{.pbtn{display:none!important;}}</style></head><body>";
  H += "<div class='top'><h1>&#128138; יומן בריאות — דוח לרופא</h1>";
  H += "<div class='sub'>הודפס: "+fd(today())+" &nbsp;|&nbsp; תקופה: "+range+" &nbsp;|&nbsp; "+f.length+" רשומות</div></div>";
  H += "<div class='avgs'>";
  H += "<div class='ab'><div class='al'>ממוצע סוכר</div><div class='av'>"+(ag||"—")+" <span style='font-size:10px'>mg/dL</span></div></div>";
  H += "<div class='ab'><div class='al'>ממוצע לחץ דם</div><div class='av'>"+(as&&ad?as+"/"+ad:"—")+" <span style='font-size:10px'>mmHg</span></div></div>";
  H += "</div>";
  H += "<button class='pbtn' onclick='window.print()' style='width:100%;padding:13px;background:#2C3E6B;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:800;margin-bottom:14px;cursor:pointer;font-family:inherit;'>&#128438; הדפס / שמור כ-PDF</button>";
  f.forEach(function(e) {
    H += "<div class='row'><div class='dt'>"+fd(e.date)+" &middot; "+e.time+" &middot; "+e.meal+"</div><div class='vals'>";
    if(e.glucose)           H += "<div class='v'>&#129400; "+e.glucose+" <small>mg/dL</small></div>";
    if(e.bpSys && e.bpDia) H += "<div class='v'>&#10084; "+e.bpSys+"/"+e.bpDia+" <small>mmHg</small></div>";
    if(e.pulse)             H += "<div class='v'>&#128147; "+e.pulse+" <small>bpm</small></div>";
    H += "</div>"+(e.notes?"<div class='note'>"+e.notes+"</div>":"")+"</div>";
  });
  H += "</body></html>";
  return { html:H, ag:ag, as:as, ad:ad };
}

function doPrint() {
  var f = getFiltered();
  if (!f.length) { alert("אין רשומות בתקופה הנבחרת. בחר 'הכל' ונסה שוב."); return; }
  var range = hDays>=9999 ? "כל הרשומות" : hDays+" הימים האחרונים";
  var rep = buildReportHTML(f, range);
  // Download as HTML file - works on all browsers and devices
  var blob = new Blob([rep.html], {type: "text/html;charset=utf-8"});
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement("a");
  a.href     = url;
  a.download = "דוח_בריאות_" + today() + ".html";
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(function() {
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }, 1000);
  toast("✓ הקובץ הורד — פתח אותו ולחץ הדפס");
}

function doEmail() {
  try {
  var f = getFiltered();
  if (!f.length) { alert("אין רשומות בתקופה הנבחרת. בחר 'הכל' ונסה שוב."); return; }
  var range = hDays>=9999 ? "כל הרשומות" : hDays+" הימים האחרונים";
  var gv=[],sv=[],dv=[];
  f.forEach(function(e) {
    if(e.glucose) gv.push(e.glucose);
    if(e.bpSys)   sv.push(e.bpSys);
    if(e.bpDia)   dv.push(e.bpDia);
  });
  var ag=avgArr(gv), as=avgArr(sv), ad=avgArr(dv);
  var subject = encodeURIComponent("יומן בריאות — דוח לרופא | " + fd(today()));
  var body = "שלום,\n\nמצורף דוח מדדי הבריאות שלי לתקופה: " + range + "\n";
  body += "תאריך הפקת הדוח: " + fd(today()) + "\n";
  body += "מספר רשומות: " + f.length + "\n\n";
  if (ag) body += "ממוצע סוכר בדם: " + ag + " mg/dL\n";
  if (as && ad) body += "ממוצע לחץ דם: " + as + "/" + ad + " mmHg\n";
  body += "\n--- פירוט הרשומות ---\n\n";
  f.forEach(function(e) {
    body += fd(e.date) + " | " + e.time + " | " + e.meal + "\n";
    if (e.glucose)           body += "  סוכר: " + e.glucose + " mg/dL\n";
    if (e.bpSys && e.bpDia) body += "  לחץ דם: " + e.bpSys + "/" + e.bpDia + " mmHg\n";
    if (e.pulse)             body += "  דופק: " + e.pulse + " bpm\n";
    if (e.notes)             body += "  הערה: " + e.notes + "\n";
    body += "\n";
  });
  body += "\nנשלח מאפליקציית יומן הבריאות";
  window.location.href = "mailto:?subject=" + subject + "&body=" + encodeURIComponent(body);
  } catch(err) { alert("שגיאה: " + err.message); }
}

function openDoc() {
  document.getElementById("ov").classList.add("show");
  var el = document.getElementById("doc-cnt");
  if (!entries.length) { el.innerHTML="<div class='empty'>אין נתונים עדיין</div>"; return; }
  var co=new Date(); co.setDate(co.getDate()-7);
  var r=entries.filter(function(e){return new Date(e.date)>=co;});
  var gv=[],sv=[],dv=[];
  r.forEach(function(e){if(e.glucose)gv.push(e.glucose);if(e.bpSys)sv.push(e.bpSys);if(e.bpDia)dv.push(e.bpDia);});
  var ag=avgArr(gv),as=avgArr(sv),ad=avgArr(dv);
  var h="<div class='sg'>";
  h+="<div class='sb2'><div style='font-size:12px;color:#1a2745;font-weight:700;'>ממוצע סוכר (7 ימים)</div><div style='font-size:21px;font-weight:800;color:#1a2745;'>"+(ag||"—")+" <span style='font-size:11px;'>mg/dL</span></div></div>";
  h+="<div class='sb2'><div style='font-size:12px;color:#1a2745;font-weight:700;'>ממוצע ל\"ד (7 ימים)</div><div style='font-size:21px;font-weight:800;color:#1a2745;'>"+(as&&ad?as+"/"+ad:"—")+" <span style='font-size:11px;'>mmHg</span></div></div></div>";
  entries.slice(0,60).forEach(function(e){
    h+="<div class='hi'><div class='hd'>"+fd(e.date)+" &middot; "+e.time+" &middot; "+e.meal+"</div><div class='hvs'>";
    if(e.glucose)           h+="<div class='hv'>&#129400; "+e.glucose+" <small>mg/dL</small></div>";
    if(e.bpSys&&e.bpDia)   h+="<div class='hv'>&#10084; "+e.bpSys+"/"+e.bpDia+" <small>mmHg</small></div>";
    if(e.pulse)             h+="<div class='hv'>&#128147; "+e.pulse+" <small>bpm</small></div>";
    h+="</div>"+(e.notes?"<div class='hn'>"+e.notes+"</div>":"")+"</div>";
  });
  el.innerHTML = h;
}
function closeDoc() { document.getElementById("ov").classList.remove("show"); }
</script>
</body>
